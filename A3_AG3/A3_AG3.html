<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A3-AG3 figure/ figcaption</title>
  </head>
  <body>
    <h1>Trabalhando com imagens</h1>
    <h2>Exemplo 1: Imagem com figure</h2>
    
    <figure>
        <img src="imagens_A3/confia.jpeg" alt="confia" width="30%" />
        <figcaption>Confia pae</figcaption>
    </figure>

    <figure>
        <img src="imagens_A3/images.jfif" alt="confia" width="30%" />
        <figcaption>Confia pae</figcaption>
        </img>
    </figure>

  </body>
</html>
