<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="" />
    <title>A8 - AG1 - Flexbox</title>
    <style>

        body{
            margin: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header, 
        .menu, 
        .conteudo,
        .footer{
            border: 2px solid #333;
            padding: 30px;
            font-size: 24px;
            text-align: center;
        }

        .principal{
            display: flex;
            gap: 15px;
            margin: 10px 0;
        }

        .conteudo{
            flex: 1;
        }

    </style>
  </head>
  <body>

    <div class="header">
        HEARDER
    </div>

    <div class="principal">
        <div class="menu">
            MENU
        </div>

        <div class="conteudo">
        CONTEÚDO
        </div>
    </div>

    <div class="footer">
        FOOTER
    </div>

  </body>
</html>
