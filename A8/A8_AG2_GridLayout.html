<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="" />
    <title>A8 - AG2 - Grid</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
      }

      .pagina {
        display: grid;
        grid-template-columns: 250px 1fr;
        grid-template-rows: 100px 1fr 80px;
        min-height: 100vh;
        gap: 10px;
      }

      .pagina > * {
        padding: 30px;
        font-size: 24px;
        text-align: center;
        border: 3px solid #333;
      }

      .cabecalho{
        grid-column: 1 / 3;
      }
      
      .rodape{
        grid-column: 1 / 3;
      }

      .conteudo{
        grid-column: 2 / 3;
        grid-row: 2 / 3;
      }
    </style>
  </head>
  <body>
    <div class="pagina">
        <header class="cabecalho">
            Cabeçalho
        </header>
        <aside class="menu">
            menu principal
        </aside>
        <main class="conteudo">
            menu lateral
        </main>

        <footer class="rodape">
            Rodapé
        </footer>

    </div>
  </body>
</html>
