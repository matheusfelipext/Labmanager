<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="" />
    <title>A8 - AG1 - Float</title>
    <style>
     body{
        margin: 20px;
        font-family: Arial, Helvetica, sans-serif;
     }

     .header, .menu, .conteudo, .footer{
        border: 2px solid #333;
        padding: 30px;
        font-size: 24px;
        box-sizing: border-box;
     }

     .header, .footer{
        width: 100%;
        margin-bottom: 10px;
     }

     .menu{
        float: left;
        width: 25%;
    }
    .conteudo{
        float: left;
        width: 75%;
    }

    .clear{
        clear: both;
    }

    .footer{
        margin-top: 10px;
    }

    </style>
  </head>
  <body>
    <div class="header">
        HEARDER
    </div>

    <div class="menu">MENU

    </div>

    <div class="conteudo">CONTEÚDO

    </div>

    <div class="clear"></div>

    <div class="footer">
        FOOTER
    </div>

  </body>
</html>
