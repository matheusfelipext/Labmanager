<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/AG4_varios.css" />
    <title>Classes</title>
  </head>
  <body>
    <header id="cabecalho-principal"><h1>LabManager</h1>
    <p>
        Sistemas de Gerencuamento de Laboratório
    </p>
</header>

    <main id="conteudo-principal">

      <section class="laboratorio-card">
            <h2>Laboratório 01</h2>
            <p>Bloco A - 25 computadores</p>
            <p class="status status-disponivel"> Disponível para uso</p>
            <button class="botao botao-primario">Reservar laboratório</button>
      </section>

      <section class="laboratorio-card">
            <h2>Laboratório 02</h2>
            <p>Bloco B - 20 computadores</p>
            <p class="status status-manutencao">Em manutenção</p>
            <button class="botao botao-desabilitado" disabled>Indisponível</button>
      </section>

    </main>

    <footer id="rodape-principal">
        <p>Desenvolvimento Front-End - 2026</p>
    </footer>
  </body>
</html>
